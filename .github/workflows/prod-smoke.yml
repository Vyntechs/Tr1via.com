name: Prod smoke

# Runs zero-cost production health and browser checks automatically:
#   • After every push to main (waits for Vercel to deploy, then smokes)
#   • On-demand via "Run workflow" button on the Actions tab
# Paid Anthropic + Pexels generation runs only when a manual run explicitly
# opts in with run_paid_generation.
#
# Silence means green. If anything turns red GitHub emails the repo owner.
# That's the entire UX — Brandon never runs a check manually.
#
# One-time setup: add four secrets at Settings → Secrets and variables →
# Actions:
#   NEXT_PUBLIC_SUPABASE_URL     (e.g. https://citweuctcnuxmqjxcbiz.supabase.co)
#   SUPABASE_SERVICE_ROLE_KEY    (the prod key, NOT the anon key)
#   SMOKE_FOUNDER_EMAIL          (brandon@vyntechs.com)
#   SMOKE_FOUNDER_PASSWORD       (the founder's TR1VIA password — host sign-in
#                                 needs email + password; set it at
#                                 /host/set-password first)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_paid_generation:
        description: Run real Anthropic + Pexels generation (paid)
        required: true
        type: boolean
        default: false

concurrency:
  # Avoid stacking smokes if multiple pushes land close together. The
  # latest run wins; older queued ones get cancelled.
  group: prod-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install deps
        run: npm ci --no-audit --no-fund

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Wait for Vercel deploy to settle (push trigger only)
        if: github.event_name == 'push'
        run: |
          # Vercel typically deploys in 30-60s. Poll the site for up to 5
          # minutes before going on. The probe loads the /login PAGE (GET,
          # no sign-in attempt): it must NOT hit /api/auth/login, whose
          # per-IP cap (lib/auth/rate-limits.ts, 30 per 15 min) would count
          # every probe and could lock the smoke's own sign-in out.
          for i in $(seq 1 30); do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" https://tr1via.com/login)
            echo "[$i] health probe -> $CODE"
            # 200 = the site is up and rendering pages
            # 404/5xx = not deployed yet / backend issue
            if [ "$CODE" = "200" ]; then echo "deploy live"; break; fi
            sleep 10
          done

      - name: API smoke (real Anthropic + Pexels + Supabase)
        if: github.event_name == 'workflow_dispatch' && inputs.run_paid_generation == true
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SMOKE_FOUNDER_EMAIL: ${{ secrets.SMOKE_FOUNDER_EMAIL }}
          SMOKE_FOUNDER_PASSWORD: ${{ secrets.SMOKE_FOUNDER_PASSWORD }}
          SMOKE_BASE_URL: https://tr1via.com
          SMOKE_GEN_TIMEOUT_MS: 240000
        run: node scripts/prod-smoke.mjs "smoke check $(date +%s)"

      - name: UI smoke (real browser → tr1via.com)
        env:
          SMOKE_FOUNDER_EMAIL: ${{ secrets.SMOKE_FOUNDER_EMAIL }}
          SMOKE_FOUNDER_PASSWORD: ${{ secrets.SMOKE_FOUNDER_PASSWORD }}
          SMOKE_BASE_URL: https://tr1via.com
        run: npx playwright test --config=playwright-prod.config.ts

      # Full game-night driver: 3 simulated phones, 2 games, ~14 reveals end
      # to end. ~80s green on prod. Catches the test-fixture/prod-divergence
      # bug class that bypassed seed-night this week: real /api/nights →
      # 'draft' state → /open → join → /start → reveal → /answers → resolve.
      # If this step turns red, a real player just hit a bug.
      # One theme pass and one category per game still drive all 14 reveals,
      # both game boundaries, three phones, scoring, and the leaderboard while
      # avoiding four expensive AI generations. Generation gets the same 4m
      # budget as the API smoke; the 12m step budget leaves room for two cold
      # verified generations plus the complete two-game arc and cleanup.
      #
      # The pass plays with NO theme override, exactly like a real host's
      # night: the calendar month picks the look (November in November).
      # SMOKE_EXPECT_THEME asserts that, and SMOKE_BROWSER opens the real TV
      # (1600x900) plus one robot's real phone in Chromium for both games,
      # photographs each key moment, checks the month's look is on screen and
      # fails on console errors. Screenshots + console log are uploaded below.
      # Update SMOKE_EXPECT_THEME when running in another month.
      - name: Full-flow driver (3 phones × 2 games, month look, real screens)
        if: github.event_name == 'workflow_dispatch' && inputs.run_paid_generation == true
        timeout-minutes: 16
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SMOKE_FOUNDER_EMAIL: ${{ secrets.SMOKE_FOUNDER_EMAIL }}
          SMOKE_FOUNDER_PASSWORD: ${{ secrets.SMOKE_FOUNDER_PASSWORD }}
          SMOKE_BASE_URL: https://tr1via.com
          SMOKE_THEME_SINGLE: auto
          SMOKE_EXPECT_THEME: november
          SMOKE_BROWSER: "1"
          SMOKE_SCREENS_DIR: smoke-screens
          CATEGORIES_PER_GAME: 1
          SMOKE_GEN_TIMEOUT_MS: 240000
        run: node scripts/full-flow-prod.mjs

      # Screenshots + console log only. No Playwright trace or HAR: those
      # would carry the founder's sign-in cookies into a downloadable file.
      - name: Upload real-screen screenshots
        if: always() && github.event_name == 'workflow_dispatch' && inputs.run_paid_generation == true
        uses: actions/upload-artifact@v4
        with:
          name: full-flow-screens
          path: smoke-screens/
          if-no-files-found: warn
          retention-days: 14
